<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS 보호자 모니터 (리셉션)</title>
<link rel="manifest" href="/manifest-reception.json">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#4ca1b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
<style>
  .add-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 14px; color: var(--muted); padding-left: 2px; }
  .inp { height: 46px; border: 1.5px solid var(--btn-line); border-radius: 12px; padding: 0 14px; font-size: 16px; background: #fff; color: var(--text); width: 200px; outline: none; }
  .inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,95,158,.15); }
  .add-row .btn.primary { height: 46px; padding: 0 26px; }

  .selbar { margin: 18px 0 10px; padding: 10px 14px; border-radius: 10px; background: #f1f4f8; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .selbar b { font-size: 16px; }
  .selbar.has { background: #eaf0fb; }

  .srow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sbtn { min-width: 84px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--btn-line); background: var(--btn); font-weight: 800; color: #1e293b; }
  .sbtn.wait { color: #b91c1c; }
  .sbtn:disabled { opacity: .4; cursor: not-allowed; }
  .sbtn.cur { outline: 3px solid var(--sel); outline-offset: 1px; }
  .sbtn.del { background: #1e293b; border-color: #1e293b; color: #fff; }
  .sbtn:not(:disabled):hover { filter: brightness(.96); }

  .memo-row { display: flex; gap: 10px; margin-top: 8px; }
  .memo-row .inp { flex: 1; width: auto; }

  /* 콜요청 배너 */
  .callb { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #fffbeb; border: 2px solid #f59e0b; border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; animation: pulseA 1.4s infinite; }
  .callb.seen { animation: none; border-style: dashed; background: #fffdf5; }
  .callb .t { font-size: 18px; font-weight: 800; }
  .callb .m { color: #92400e; font-size: 14px; }
  .callb .sp { flex: 1; }
  .callb .btn { padding: 9px 14px; }

  /* 목록 */
  .grid { display: grid; grid-template-columns: minmax(180px, 2.2fr) 1.1fr 0.9fr 1.3fr 1fr; align-items: center; gap: 10px; }
  .lhead { padding: 12px 18px; border: 1px solid var(--line); border-radius: 12px; background: #f7f9fc; font-weight: 800; font-size: 14px; color: #334155; }
  .rows { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .row { padding: 12px 18px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; transition: border-color .12s; }
  .row:hover { border-color: #b8c4d6; }
  .row.sel { border: 3px solid var(--sel); padding: 10.5px 16.5px; }
  .row.call { background: #fffbeb; }
  .row.done { opacity: .55; }
  .nm { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .memo { font-size: 13px; color: #475569; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
  .tag.call { background: #f59e0b; color: #1f1300; animation: blink 1s infinite; }
  .tag.call.seen { animation: none; background: #fde68a; }
  .tag.old { background: #e2e8f0; color: #475569; }
  .el { font-weight: 700; color: #334155; }
  .el.warn { color: #c2410c; }
  .el.alert { color: #dc2626; animation: blink 1.2s infinite; }
  .ack { font-weight: 800; font-size: 14px; display: inline-block; padding: 4px 10px; border-radius: 8px; }
  .ack.ok { color: #15803d; background: #dcfce7; }
  .ack.wait { color: #b91c1c; background: #fee2e2; }
  .ack.late { color: #fff; background: #dc2626; animation: pulse 1.2s infinite; }
  .ack.hold { color: #9a3412; background: #ffedd5; border: 1.5px solid #fb923c; animation: blink 1.4s infinite; }
  .when { font-size: 14px; color: var(--muted); text-align: right; }
  .tl { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; }
  .tl .lbl { font-weight: 800; color: var(--muted); margin-right: 2px; }
  .tl .step { padding: 3px 8px; border-radius: 6px; background: #f1f5f9; white-space: nowrap; }
  .tl .step.first { background: #dbeafe; color: #1e3a8a; font-weight: 800; }
  .tl .arr { color: #94a3b8; }
  .listfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .listfoot .btn { padding: 7px 12px; font-size: 13px; }
  .empty { text-align: center; padding: 30px; color: var(--muted); }
  .err { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; font-weight: 700; }

  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr auto; }
    .grid .c-el, .grid .c-when, .lhead .c-el, .lhead .c-when, .lhead .c-ack { display: none; }
    .grid .c-ack { grid-column: 1 / -1; }
    .inp { width: 100%; }
    .field { flex: 1; min-width: 140px; }
  }
</style>
</head>
<body class="light">
<div class="wrap">
  <div class="top">
    <h1><img class="logo" src="/icons/icon-64.png" alt="BAEKSAN">BS 보호자 모니터 (리셉션)</h1>
    <div class="sp"></div>
    <span id="who" class="muted small"></span>
    <button id="btnSound" class="icon-btn" title="알림음 켜기/끄기">🔊 알림음</button>
    <button id="btnNotify" class="icon-btn" title="창이 가려져 있어도 바탕화면 알림 받기">🔔 바탕화면 알림</button>
    <button id="btnLogout" class="icon-btn" hidden>로그아웃</button>
  </div>

  <div id="err"></div>
  <div id="callBanner"></div>

  <div class="card">
    <div class="add-row">
      <div class="field"><label for="inCat">고양이 이름</label><input id="inCat" class="inp" placeholder="예: 냥냥이" autocomplete="off"></div>
      <div class="field"><label for="inOwner">보호자 이름</label><input id="inOwner" class="inp" placeholder="예: 김땡땡" autocomplete="off"></div>
      <button id="btnAdd" class="btn primary">환자 추가 · 내원 알림</button>
    </div>

    <div id="selbar" class="selbar"></div>
    <div id="statusBtns"></div>

    <div class="memo-row">
      <input id="inMemo" class="inp" placeholder="간단한 메모를 입력하세요… (Enter 저장)" autocomplete="off">
      <button id="btnMemo" class="btn">메모 저장</button>
    </div>
  </div>

  <div class="card">
    <div class="lhead grid">
      <div>이름</div><div>상태</div><div class="c-el">상태 경과</div><div class="c-ack">의국 확인</div><div class="c-when" style="text-align:right">내원 시각</div>
    </div>
    <div id="list" class="rows"></div>
    <div class="listfoot">
      <span id="count"></span>
      <span><button id="btnShowDone" class="btn">귀가 보기</button> <button id="btnCleanup" class="btn">귀가 환자 기록 삭제</button></span>
    </div>
  </div>
</div>

<div class="foot">
  <span id="conn" class="pill">연결 중…</span>
  <button id="btnTest" class="pill dark">연결 테스트</button>
</div>

<script type="module">
import {
  createStore, Sound, RepeatingAlarm, SETTINGS, STATUS, BUTTON_ROWS, WAIT_STATUSES,
  esc, displayName, fmtClock, fmtHM, fmtElapsed, fmtSec, waitLevel, logList, routeHtml, isToday, badgeStyle,
  toast, soundGate, loginScreen, desktopNotify, requestNotify, notifyState, NOW,
} from './common.js';

const $ = (id) => document.getElementById(id);
const TITLE = 'BS 보호자 모니터 (리셉션)';
let store, patients = {}, prev = null, selected = null;
const callAlarm = new RepeatingAlarm('call');

// 첫 화면 클릭으로 알림음 활성화
soundGate('리셉션 화면 시작 — 클릭하세요');

try {
  store = await createStore();
} catch (e) {
  $('err').innerHTML = `<div class="err">서버 연결 모듈을 불러오지 못했습니다: ${esc(e.message)}</div>`;
  throw e;
}

if (store.auth) {
  const user = await loginScreen(store, TITLE);
  $('who').textContent = user.email || '';
  $('btnLogout').hidden = false;
  $('btnLogout').onclick = () => store.auth.signOut().then(() => location.reload());
}

// ── 연결 상태 ───────────────────────────────
store.onConnection((ok) => {
  const c = $('conn');
  if (store.mode === 'demo') { c.className = 'pill demo'; c.textContent = '데모 모드 · 이 브라우저 안에서만 공유'; return; }
  c.className = ok ? 'pill' : 'pill bad';
  c.textContent = ok ? '연결됨' : '연결 끊김 — 재연결 중';
});
$('btnTest').onclick = async () => {
  try { const ms = await store.ping(); toast(store.mode === 'demo' ? '데모 모드: 이 브라우저 안의 다른 탭과 공유 중입니다' : `서버 응답 정상 (${ms}ms)`); }
  catch (e) { toast('연결 테스트 실패: ' + (e.code || e.message)); }
};

// ── 알림음 / 바탕화면 알림 버튼 ─────────────────
function paintSoundBtn() { $('btnSound').textContent = Sound.enabled ? '🔊 알림음' : '🔇 알림음 꺼짐'; $('btnSound').classList.toggle('off', !Sound.enabled); }
$('btnSound').onclick = () => { Sound.unlock(); Sound.setEnabled(!Sound.enabled); paintSoundBtn(); if (Sound.enabled) Sound.play('chime'); };
paintSoundBtn();
function paintNotifyBtn() { const s = notifyState(); $('btnNotify').classList.toggle('off', s !== 'granted'); $('btnNotify').textContent = s === 'granted' ? '🔔 바탕화면 알림 켜짐' : '🔔 바탕화면 알림'; }
$('btnNotify').onclick = async () => { const r = await requestNotify(); paintNotifyBtn(); if (r === 'denied') toast('브라우저 설정에서 이 사이트의 알림을 허용해 주세요'); };
paintNotifyBtn();

// ── 상태 버튼 ───────────────────────────────
$('statusBtns').innerHTML = BUTTON_ROWS.map((row, i) =>
  `<div class="srow">${row.map((s) => `<button class="sbtn${WAIT_STATUSES.includes(s) ? ' wait' : ''}" data-s="${s}">${s}</button>`).join('')}${i === BUTTON_ROWS.length - 1 ? '<button class="sbtn del" data-del="1">삭제</button>' : ''}</div>`
).join('');
$('statusBtns').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled || !selected || !patients[selected]) return;
  if (b.dataset.del) return doDelete(selected);
  setStatus(selected, b.dataset.s);
});

// 라운지/외출(아직 자리 비움) 외의 상태로 바뀌면 진행 중 콜요청은 완료로 처리
const KEEP_CALL = ['라운지', '외출'];
async function setStatus(id, s) {
  const p = patients[id]; if (!p || p.status === s) return;
  const f = { status: s, statusAt: NOW };
  if (p.call && !KEEP_CALL.includes(s)) f.call = null;
  const prevStatus = p.status;
  await store.update(id, f, s);
  if (s === '귀가' && !showDone) {
    if (selected === id) select(null);
    toast(`${displayName(p)} 귀가 — 목록에서 숨김`, { ms: 7000, action: { label: '되돌리기', run: () => store.update(id, { status: prevStatus, statusAt: NOW }, prevStatus) } });
  }
}

// ── 귀가 환자 표시/숨김 ─────────────────────
let showDone = (() => { try { return localStorage.getItem('bsm.rShowDone') === '1'; } catch { return false; } })();
$('btnShowDone').onclick = () => { showDone = !showDone; try { localStorage.setItem('bsm.rShowDone', showDone ? '1' : '0'); } catch {} render(); };

async function doDelete(id) {
  const p = patients[id]; if (!p) return;
  const snap = JSON.parse(JSON.stringify(p));
  await store.remove(id);
  if (selected === id) select(null);
  toast(`${displayName(p)} 삭제됨`, { ms: 7000, action: { label: '되돌리기', run: () => store.restore(id, snap) } });
}

// ── 환자 추가 ───────────────────────────────
async function addPatient() {
  const cat = $('inCat').value.trim(), owner = $('inOwner').value.trim();
  if (!cat && !owner) { $('inCat').focus(); return; }
  const id = await store.add({ cat: cat || '(이름 미입력)', owner });
  $('inCat').value = ''; $('inOwner').value = '';
  select(id);
  $('inCat').focus();
  toast(`${displayName({ cat: cat || '(이름 미입력)', owner })} 내원 — 의국에 알림 전송`);
}
$('btnAdd').onclick = addPatient;
$('inCat').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('inOwner').value.trim() ? addPatient() : $('inOwner').focus(); } });
$('inOwner').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addPatient(); } });

// ── 메모 ───────────────────────────────────
async function saveMemo() {
  if (!selected || !patients[selected]) { toast('먼저 목록에서 환자를 선택하세요'); return; }
  await store.update(selected, { memo: $('inMemo').value.trim() });
  toast('메모 저장됨');
}
$('btnMemo').onclick = saveMemo;
$('inMemo').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveMemo(); } });

// ── 선택 ───────────────────────────────────
function select(id) {
  selected = id;
  $('inMemo').value = id && patients[id] ? (patients[id].memo || '') : '';
  render();
}
$('list').addEventListener('click', (e) => {
  const r = e.target.closest('.row'); if (!r) return;
  select(selected === r.dataset.id ? null : r.dataset.id);
});

// ── 콜요청 배너 ─────────────────────────────
$('callBanner').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.id; if (!patients[id]) return;
  if (b.dataset.act === 'seen') await store.update(id, { 'call/seenAt': NOW });
  else if (b.dataset.act === 'select') select(id);
  else await setStatus(id, b.dataset.act);
});

// ── 렌더 ───────────────────────────────────
function sorted() {
  return Object.entries(patients).map(([id, p]) => ({ id, ...p }))
    .filter((p) => showDone || p.status !== '귀가')
    .sort((a, b) => ((a.status === '귀가') - (b.status === '귀가')) || ((a.createdAt || 0) - (b.createdAt || 0)));
}

function render() {
  const now = store.now();
  const list = sorted();
  if (selected && !patients[selected]) selected = null;

  // 선택 바 + 버튼 상태
  const sp = selected && patients[selected];
  $('selbar').className = 'selbar' + (sp ? ' has' : '');
  $('selbar').innerHTML = sp
    ? `선택: <b>${esc(displayName(sp))}</b> <span class="badge" style="${badgeStyle(sp.status)}">${esc(sp.status)}</span> <span class="muted">아래 버튼을 누르면 이 환자의 상태가 바뀝니다</span>`
    : `<span class="muted">[아래 목록에서 환자를 선택한 뒤 상태 버튼을 누르세요]</span>`;
  document.querySelectorAll('#statusBtns .sbtn').forEach((b) => {
    b.disabled = !sp;
    b.classList.toggle('cur', !!sp && b.dataset.s === sp.status);
    if (sp && b.dataset.s === sp.status) b.setAttribute('style', badgeStyle(sp.status)); else b.removeAttribute('style');
  });

  // 콜요청 배너
  const calls = list.filter((p) => p.call);
  $('callBanner').innerHTML = calls.map((p) => `
    <div class="callb${p.call.seenAt ? ' seen' : ''}">
      <div>
        <div class="t">📣 의국 콜요청 — ${esc(displayName(p))}</div>
        <div class="m">현재 <b>${esc(p.status)}</b> · 요청 <span class="tick" data-k="ago" data-t="${p.call.at || now}"></span> 전${p.call.seenAt ? ' · 알림 꺼짐' : ''}</div>
      </div>
      <div class="sp"></div>
      ${p.call.seenAt ? '' : `<button class="btn" data-act="seen" data-id="${p.id}">알림 끄기</button>`}
      <button class="btn" data-act="select" data-id="${p.id}">선택</button>
      <button class="btn ok" data-act="라운지콜완료" data-id="${p.id}">라운지콜완료</button>
      <button class="btn ok" data-act="외출콜완료" data-id="${p.id}">외출콜완료</button>
    </div>`).join('');

  // 목록
  if (!list.length) {
    $('list').innerHTML = `<div class="empty">아직 내원한 환자가 없습니다. 위에서 환자를 추가하세요.</div>`;
  } else {
    $('list').innerHTML = list.map((p) => {
      const done = p.status === '귀가';
      const cls = ['row', 'grid', p.id === selected ? 'sel' : '', p.call ? 'call' : '', done ? 'done' : ''].join(' ');
      const tags = (p.call ? `<span class="tag call${p.call.seenAt ? ' seen' : ''}">📣 콜요청</span>` : '')
        + (p.createdAt && !isToday(p.createdAt, now) ? '<span class="tag old">이전 날짜</span>' : '');
      const tl = logList(p).length ? `<div class="tl"><span class="lbl">동선</span>${routeHtml(p)}</div>` : '';
      return `<div class="${cls}" data-id="${p.id}">
        <div><div class="nm">${esc(displayName(p))}${tags}</div>${p.memo ? `<div class="memo">📝 ${esc(p.memo)}</div>` : ''}</div>
        <div><span class="badge" style="${badgeStyle(p.status)}">${esc(p.status)}</span></div>
        <div class="c-el"><span class="el tick" data-k="el" data-id="${p.id}"></span></div>
        <div class="c-ack"><span class="ack tick" data-k="ack" data-id="${p.id}"></span></div>
        <div class="c-when when">${fmtClock(p.createdAt)}</div>
        ${tl}
      </div>`;
    }).join('');
  }
  const allP = Object.values(patients);
  const active = allP.filter((p) => p.status !== '귀가').length;
  const doneN = allP.length - active;
  $('count').textContent = `원내 관리 중 ${active}명 · 귀가 ${doneN}명${showDone ? '' : ' (숨김)'}`;
  $('btnShowDone').textContent = showDone ? '귀가 숨기기' : `귀가 보기 (${doneN})`;

  tick();
}

// 시간 표시만 매초 갱신 (목록 전체를 다시 그리지 않음)
function tick() {
  const now = store.now();
  document.querySelectorAll('.tick').forEach((el) => {
    const k = el.dataset.k;
    if (k === 'ago') { el.textContent = fmtElapsed(now - Number(el.dataset.t)); return; }
    const p = patients[el.dataset.id]; if (!p) return;
    if (k === 'el') {
      el.textContent = fmtElapsed(now - (p.statusAt || now));
      el.className = 'el tick ' + waitLevel(p, now);
    } else if (k === 'ack') {
      if (p.ackAt) { el.className = 'ack tick ok'; el.textContent = `✓ 확인 ${fmtHM(p.ackAt)}`; }
      else if (p.holdAt) { el.className = 'ack tick hold'; el.textContent = `⏸ 의국 보류 ${fmtHM(p.holdAt)}`; }
      else {
        const w = now - (p.createdAt || now);
        el.className = 'ack tick ' + (w >= SETTINGS.ackWarnSec * 1000 ? 'late' : 'wait');
        el.textContent = `확인 대기 ${fmtSec(w)}`;
      }
    }
  });
  const pendingCalls = Object.values(patients).filter((p) => p.call && !p.call.seenAt).length;
  document.title = pendingCalls ? `📣(${pendingCalls}) 콜요청 — ${TITLE}` : TITLE;
}
setInterval(tick, 1000);

// ── 데이터 수신 ─────────────────────────────
store.onPatients((data) => {
  patients = data || {};
  let newCall = false;
  if (prev) {
    for (const [id, p] of Object.entries(patients)) {
      const o = prev[id];
      if (p.call && !p.call.seenAt && (!o || !o.call || o.call.at !== p.call.at)) {
        newCall = true;
        desktopNotify('📣 의국 콜요청', `${displayName(p)} — 현재 ${p.status}`);
      }
      if (o && !o.ackAt && p.ackAt) toast(`의국 확인 ✓ ${displayName(p)}`);
      if (o && !o.holdAt && p.holdAt && !p.ackAt) toast(`의국 보류 ⏸ ${displayName(p)}`);
    }
  }
  prev = patients;
  callAlarm.update(Object.values(patients).some((p) => p.call && !p.call.seenAt), newCall);
  render();
}, (err) => {
  $('err').innerHTML = `<div class="err">데이터를 읽을 권한이 없습니다 (${esc(err.code || err.message)}). 허용된 계정으로 로그인했는지 확인하세요.</div>`;
});

// ── 귀가 정리 ───────────────────────────────
$('btnCleanup').onclick = async () => {
  const done = Object.entries(patients).filter(([, p]) => p.status === '귀가');
  if (!done.length) { toast('정리할 귀가 환자가 없습니다'); return; }
  const snaps = done.map(([id, p]) => [id, JSON.parse(JSON.stringify(p))]);
  for (const [id] of done) await store.remove(id);
  toast(`귀가 환자 ${done.length}명 정리됨`, { ms: 7000, action: { label: '되돌리기', run: () => snaps.forEach(([id, p]) => store.restore(id, p)) } });
};
</script>
</body>
</html>
